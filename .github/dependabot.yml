# The workflow actions are pinned to commit SHAs, which is the right default and
# also means they never move on their own. This is what moves them.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev:
        dependency-type: development
        patterns: ["*"]
